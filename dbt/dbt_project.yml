#Name project and define versions
name: 'etoro_portfolio_project'
version: '1.0.0'
config-version: 2

#Set profile
profile: 'etoro_portfolio'

#Where to look for models, snapshots etc.
model-paths: ['models']
test-paths: ['tests']
snapshot-paths: ['snapshots']
analysis-paths: ['analyses']
seed-paths: ['seeds']
macro-paths: ['macros']

#Target paths and paths to clean
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

#Define models
models:
  etoro_portfolio_project:
    silver:
      +schema: silver
      +materialized: incremental
    gold:
      +schema: gold
      +materialized: table
      +full_refresh: true
    marts:
      +schema: marts
      +materialized: view

#Define snapshots, target path and strategy
snapshots:
  etoro_portfolio_project:
    +target_schema: silver
    +strategy: timestamp
    +updated_at: loaded_at