version: 2

models:
  - name: silver_instruments
    description: "Structured instrument metadata — all tradeable instruments available on eToro. Refreshed incrementally, one row per instrument per load"
    columns:
      - name: instrument_id
        description: "Unique instrument identifier"
        tests:
          - not_null
      - name: asset_class
        description: "The asset type of the instrument"
        tests:
          - not_null

  - name: silver_open_positions
    description: "Flattened portfolio positions, including mirror positions"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - not_null
      - name: amount
        description: "Amount in USD of the stock purchased"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: is_buy
        description: "Boolean value - true when the stock has been bought, false when sold"
        tests:
          - not_null
      - name: instrument_id
        description: "Unique instrument id of the instrument being bought or sold"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_instruments')
                field: 'instrument_id'
      - name: open_rate
        description: "The opening price paid for this position in the portfolio"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: units
        description: "The number of units of the asset purchased"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true

  - name: silver_available_credit
    description: "Available cash held within each mirror position and at the account level"

  - name: silver_price_series
    description: "Comprehensive time series showing the live price, high and low for a given time period by instrument held within the portfolio"
    columns:
      - name: instrument_id
        description: "Instrument identifier"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_instruments')
                field: 'instrument_id'
      - name: price_timestamp
        description: "The timestamp corresponding to this stock price"
      - name: live_price
        description: "The current price of the corresponding instrument"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: high
        description: "The highest price of this instrument for the given time period"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: low
        description: "The lowest price of this instrument for the given time period"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
    
  - name: silver_price_scaffold
    description: "Scaffold providing all available price timestamps in 5 minute increments across instruments for time series construction"